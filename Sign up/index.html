<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga_Read - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#0e0e0e] min-h-screen flex items-center justify-center text-white">
  <div class="w-[90vw] md:w-[900px] md:h-[560px] bg-[#141414] flex flex-col md:flex-row rounded-[20px] overflow-hidden shadow-[0_0_35px_rgba(255,0,0,0.2)]">
    <!-- Left Image Section -->
    <div class="w-full md:w-1/2 h-[250px] md:h-auto">
      <img src="../poster.jpg" alt="Manga Poster" class="w-full h-full object-cover" />
    </div>

    <!-- Sign Up Form Section -->
    <div class="w-full md:w-1/2 p-8 md:p-11 flex flex-col justify-center items-center text-center">
      <h2 class="text-[28px] mb-1">Create Account</h2>
      <p class="text-sm text-white/70 mb-5">Sign up to start reading manga</p>

      <form id="signupForm" class="w-full">
        <input class="w-full px-4 py-3 rounded-[14px] mb-4 bg-[#eaeaea] text-[#333] text-sm outline-none" type="text" id="username" placeholder="Username" required />
        <input class="w-full px-4 py-3 rounded-[14px] mb-4 bg-[#eaeaea] text-[#333] text-sm outline-none" type="email" id="email" placeholder="Email" required />
        <input class="w-full px-4 py-3 rounded-[14px] mb-4 bg-[#eaeaea] text-[#333] text-sm outline-none" type="password" id="password" placeholder="Password" required />
        <input class="w-full px-4 py-3 rounded-[14px] mb-4 bg-[#eaeaea] text-[#333] text-sm outline-none" type="password" id="confirm" placeholder="Confirm Password" required />

        <div class="flex items-center justify-center text-sm mb-4 gap-2">
          <input type="checkbox" id="terms" class="mr-2" />
          <label for="terms">I agree to the terms &amp; conditions</label>
        </div>

        <button type="submit" class="w-full py-3 rounded-[30px] bg-gradient-to-r from-[#ff4d4d] to-[#ff0000] text-white text-[15px] font-semibold mb-4 transition-opacity hover:opacity-90 active:scale-95">Sign Up</button>
      </form>

      <div class="text-center my-4 opacity-50 text-sm">OR</div>

      <button id="googleSignUpBtn" class="w-full bg-white border border-[#dadce0] rounded-[30px] py-3 text-[#3c4043] flex items-center justify-center gap-3 font-semibold text-[15px] mb-4 hover:bg-[#f8f9fa] active:scale-95">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="mt-4 text-sm">Already have an account? <a href="../Sign in/index.html" class="text-[#ff4d4d] font-semibold hover:underline hover:text-[#ff6666]">Sign In</a></p>
    </div>
  </div>

  <script src="../script.js"></script>
</body>
</html>
