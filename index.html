<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga_Read - Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Left Image Section -->
    <div class="image-box">
      <img src="poster.jpg" alt="Manga Poster" />
    </div>

    <!-- Sign Up Form Section -->
    <div class="form-box">
      <h2>Create Account</h2>
      <p>Sign up to start reading manga</p>

      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <input type="password" id="confirm" placeholder="Confirm Password" required />

        <div class="remember">
          <input type="checkbox" id="terms" />
          <label for="terms">I agree to the terms & conditions</label>
        </div>

        <button type="submit" class="btn-main">Sign Up</button>
      </form>

      <div class="divider">OR</div>

      <button class="btn-google">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          alt="Google Logo"
        />
        Continue with Google
      </button>

      <p class="login-link">
        Already have an account? <a href="./Sign in/index.html">Sign In</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
